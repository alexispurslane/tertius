# The image of the Runpod GPU worker (tools/runpod/README.md). It builds tools/runpod/Dockerfile from the files of one
# commit and pushes it to ghcr.io/<owner>/tertius-gpu:<commit>. A push to main that changes the dev shell or the
# image's own files builds it, and so does a push of a tag gpu-image-*, for any commit, or a manual run. Other changes
# need no image: a job fetches its commits and builds them in the image's dev shell.
name: gpu-image

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - native/**
      - tools/runpod/Dockerfile
      - tools/runpod/provision.sh
      - tools/runpod/handler.py
      - tools/runpod/worker.py
      - .github/workflows/gpu-image.yml
    tags: ["gpu-image-*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer build of the same ref replaces one in flight.
concurrency:
  group: gpu-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The dev shell's closure needs more disk than the runner has free. These are toolchains that the build does
      # not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # The context is the commit's files from git archive, so the checkout's .git folder and anything else stay out.
      - name: Build and push
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tertius-gpu"
          context=$(mktemp -d)
          git archive --format=tar "$GITHUB_SHA" | tar -x -C "$context"
          docker buildx build --platform linux/amd64 -f "$context/tools/runpod/Dockerfile" \
            --build-arg BAKED_COMMIT="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --cache-from type=registry,ref="$image:buildcache" \
            --cache-to type=registry,ref="$image:buildcache",mode=max \
            -t "$image:$GITHUB_SHA" --push "$context"
          echo "pushed $image:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
